server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo estático cai no index.html,
    # deixando o React Router decidir o que renderizar (sem isso, recarregar
    # a página em /login, por exemplo, daria 404 no Nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
